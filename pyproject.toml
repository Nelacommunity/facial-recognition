[project]
name = "facial"
version = "0.1.0"
requires-python = ">=3.11"
# Python libraries for your tools (e.g. "pandas>=2.2"). Lock them with: uv lock
dependencies = [
    "opencv-python-headless>=4.8,<6",  # YuNet face detector + SFace recognizer (ONNX)
    "numpy>=1.26",
    "cryptography>=42",                # Fernet encryption of stored face embeddings
]
