# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
# Render asks for the values marked `sync: false` when the Blueprint is created.
services:
  - type: web
    name: facial
    runtime: docker
    dockerfilePath: ./Dockerfile
    # OpenCV + the models need more memory than the free tier, which also sleeps when idle.
    plan: starter
    # Pick the region closest to your Supabase project (oregon, ohio, virginia, frankfurt, singapore).
    region: frankfurt
    # Exactly one instance: enrollment sessions and decrypted galleries live in this server's memory.
    numInstances: 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Signs sessions and UI actions; Render generates a random value once.
      - key: AIX_SECRET_KEY
        generateValue: true
      # Supabase → Project Settings → API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Must be the SAME key you used to enroll people, or existing enrollments can't be decrypted.
      - key: FACEID_ENCRYPTION_KEY
        sync: false
      # Only for Supabase projects on the legacy HS256 JWT secret; leave empty otherwise.
      - key: SUPABASE_JWT_SECRET
        sync: false
